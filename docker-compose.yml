services:
  postgres:
    image: postgres:16-alpine
    container_name: cryptobot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cryptobot
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingest:
    build: ./services/ingest
    container_name: cryptobot-ingest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cryptobot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/cryptobot
    volumes:
      - telegram_session:/app/sessions
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /tmp/healthz is touched every 30s by an asyncio task in main.py.
      # If we haven't seen a write in 90s, the main loop has stalled.
      test: ["CMD-SHELL", "python -c 'import os,time; assert time.time()-os.stat(\"/tmp/healthz\").st_mtime<90'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  sentiment:
    build: ./services/sentiment
    container_name: cryptobot-sentiment
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cryptobot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/cryptobot
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,time; assert time.time()-os.stat(\"/tmp/healthz\").st_mtime<90'"]
      interval: 30s
      timeout: 5s
      retries: 3
      # CryptoBERT model load on cold cache can take ~30–60s.
      start_period: 90s

  freqtrade:
    build: ./services/freqtrade
    image: crypto-bot-freqtrade
    container_name: cryptobot-freqtrade
    restart: unless-stopped
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cryptobot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/cryptobot
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_healthy
      sentiment:
        condition: service_healthy
    healthcheck:
      # API server bound to 0.0.0.0:8080 inside the container; a TCP
      # connect proves the freqtrade web server is up.
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.settimeout(3); s.connect((\"127.0.0.1\",8080)); s.close()'"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Pair-list discovery + exchange handshake can take 30–45s.
      start_period: 60s
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy ${STRATEGY:-SampleStrategy}

  audit_bot:
    build: ./services/audit_bot
    container_name: cryptobot-audit-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cryptobot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/cryptobot
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,time; assert time.time()-os.stat(\"/tmp/healthz\").st_mtime<90'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  telegram_session:
